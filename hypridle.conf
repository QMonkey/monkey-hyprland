# =============================================================================
# hypridle — idle / auto lock, Sonokai session
# hypridle is autostarted on login (hyprland.lua). It locks with hyprlock
# after 5 idle minutes, blanks the display at 5.5 min, DPMS off at 6 min.
# No suspend/hibernate: the screen just turns off.
# =============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch hl.dsp.dpms('on')
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch hl.dsp.dpms('off')
}
