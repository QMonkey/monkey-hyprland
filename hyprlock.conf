# =============================================================================
# hyprlock — lock screen, Sonokai Dark theme
# Trimmed to the options accepted by the distro hyprlock 0.9.6 build
# (see /usr/share/hypr/hyprlock.conf for this build's accepted keys).
# Colors as rgba RRGGBBAA, matching the palette in hyprland.lua.
# Invoked by: Super+Escape bind, hyprlock --fatal-message, and hypridle.
# =============================================================================

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(2c2e34ff)
    blur_passes = 2
    blur_size = 3
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 2
    dots_size = 0.30
    dots_spacing = 0.15
    dots_center = true
    rounding = 8
    outer_color = rgba(76cce0ff)
    inner_color = rgba(2c2e34ff)
    font_color = rgba(e2e2e3ff)
    check_color = rgba(9ed072ff)
    fail_color = rgba(fc5d7cff)
    fail_text = <i>[incorrect] $FAIL (Attempt $ATTEMPTS)</i>
    fade_on_empty = true
    fade_timeout = 1500
    hide_input = false
    placeholder_text = <i>Password...</i>
    position = 0, -46
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e7c664ff)
    font_size = 72
    font_family = "monospace"
    position = 0, 62
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +'%A, %d %B'
    color = rgba(7f8490ff)
    font_size = 22
    font_family = "monospace"
    position = 0, 14
    halign = center
    valign = center
}
