# =============================================================================
# hyprpaper — wallpaper, desktop uses the purple-pink aurora image
# `monitor =` (empty) applies to every monitor; hyprpaper expands `~`.
# The repo itself is symlinked to ~/.config/hypr by install.sh, so the
# path below works regardless of where the repo is cloned.
# Invoked by: the "hyprpaper" autostart entry in hyprland.lua.
# splash = false stops hyprpaper from drawing the Hyprland splash quote
# ("Hope you like my take on the hyprland wallpaper. - Ikocman") over the image.
# =============================================================================

splash = false

wallpaper {
    monitor =
    path = ~/.config/hypr/pictures/oskar-kadaksoo-ZqJ7zs0iT7w-unsplash.jpg
}
